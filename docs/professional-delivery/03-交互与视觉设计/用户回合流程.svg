<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 Z" fill="#087f8c"/></marker></defs><rect width="1100" height="650" fill="#f5f8fb"/><text x="30" y="36" font-family="sans-serif" font-size="22" fill="#18354b">用户流程｜主路径与条件分支；持久化／恢复是横切能力</text><path d="M340,132 H390" fill="none" stroke="#087f8c" stroke-width="2" marker-end="url(#a)"/><path d="M690,132 H740" fill="none" stroke="#087f8c" stroke-width="2" marker-end="url(#a)"/><path d="M890,175 V280" fill="none" stroke="#087f8c" stroke-width="2" marker-end="url(#a)"/><text x="902" y="230" font-family="sans-serif" font-size="13" fill="#506577">移动</text><path d="M740,322 H690" fill="none" stroke="#087f8c" stroke-width="2" marker-end="url(#a)"/><path d="M390,322 H340" fill="none" stroke="#087f8c" stroke-width="2" marker-end="url(#a)"/><text x="342" y="306" font-family="sans-serif" font-size="13" fill="#506577">事件完成</text><path d="M190,280 V215 H1070 V132 H1040" fill="none" stroke="#087f8c" stroke-width="2" marker-end="url(#a)"/><text x="470" y="207" font-family="sans-serif" font-size="13" fill="#506577">下一回合／下一位</text><path d="M540,365 V420 H190 V480" fill="none" stroke="#087f8c" stroke-width="2" marker-end="url(#a)"/><text x="250" y="414" font-family="sans-serif" font-size="13" fill="#506577">进入条件满足</text><path d="M340,522 H390" fill="none" stroke="#087f8c" stroke-width="2" marker-end="url(#a)"/><path d="M690,522 H740" fill="none" stroke="#087f8c" stroke-width="2" marker-end="url(#a)"/><text x="690" y="505" font-family="sans-serif" font-size="13" fill="#506577">恢复能力</text><rect x="40" y="90" width="300" height="85" rx="10" fill="white" stroke="#087f8c"/><text x="56" y="122" font-family="sans-serif" font-size="20" fill="#18354b">标题与房间</text><text x="56" y="151" font-family="sans-serif" font-size="13" fill="#64748b">本机或在线入口</text><rect x="390" y="90" width="300" height="85" rx="10" fill="white" stroke="#087f8c"/><text x="406" y="122" font-family="sans-serif" font-size="20" fill="#18354b">职业与逐人梦想</text><text x="406" y="151" font-family="sans-serif" font-size="13" fill="#64748b">确认梦想后才可开始</text><rect x="740" y="90" width="300" height="85" rx="10" fill="white" stroke="#087f8c"/><text x="756" y="122" font-family="sans-serif" font-size="20" fill="#18354b">开始回合／休整</text><text x="756" y="151" font-family="sans-serif" font-size="13" fill="#64748b">选择骰子、借还或确认跳过</text><rect x="740" y="280" width="300" height="85" rx="10" fill="white" stroke="#087f8c"/><text x="756" y="312" font-family="sans-serif" font-size="20" fill="#18354b">掷骰与移动</text><text x="756" y="341" font-family="sans-serif" font-size="13" fill="#64748b">由规则／服务端确定结果</text><rect x="390" y="280" width="300" height="85" rx="10" fill="white" stroke="#087f8c"/><text x="406" y="312" font-family="sans-serif" font-size="20" fill="#18354b">事件／交易子状态</text><text x="406" y="341" font-family="sans-serif" font-size="13" fill="#64748b">确认、取消、贷款与强制事件</text><rect x="40" y="280" width="300" height="85" rx="10" fill="white" stroke="#087f8c"/><text x="56" y="312" font-family="sans-serif" font-size="20" fill="#18354b">更新报表／结束回合</text><text x="56" y="341" font-family="sans-serif" font-size="13" fill="#64748b">未解决pending不能交棒</text><rect x="40" y="480" width="300" height="85" rx="10" fill="white" stroke="#087f8c"/><text x="56" y="512" font-family="sans-serif" font-size="20" fill="#18354b">快车道与投资</text><text x="56" y="541" font-family="sans-serif" font-size="13" fill="#64748b">达到条件后确认进入</text><rect x="390" y="480" width="300" height="85" rx="10" fill="white" stroke="#087f8c"/><text x="406" y="512" font-family="sans-serif" font-size="20" fill="#18354b">重整／胜利／退出</text><text x="406" y="541" font-family="sans-serif" font-size="13" fill="#64748b">按状态确认与恢复</text><rect x="740" y="480" width="300" height="85" rx="10" fill="white" stroke="#087f8c"/><text x="756" y="512" font-family="sans-serif" font-size="20" fill="#18354b">保存／刷新／重连</text><text x="756" y="541" font-family="sans-serif" font-size="13" fill="#64748b">作用于各状态，不仅在终局</text></svg>