<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Cashflow 交互设计原型</title><style>body{font:15px Arial,"Microsoft YaHei",sans-serif;background:#edf3f7;color:#18354b;margin:24px}button{padding:10px 18px;margin:4px;background:#087f8c;color:white;border:0;border-radius:5px;cursor:pointer}.stage{position:relative;width:1024px;height:768px;background:#d7bb8f;border:1px solid #9c8565;margin-top:20px}.board{position:absolute;left:52px;top:86px;width:922px;height:610px;border:12px solid #775478;box-sizing:border-box;background:repeating-linear-gradient(90deg,#dce5cb 0 55px,#c2d1b5 55px 62px)}.sheet{position:absolute;left:0;top:56px;width:696px;height:712px;background:#fff7e5ee;box-sizing:border-box;padding:26px}.card{position:absolute;left:656px;top:98px;width:354px;height:388px;box-sizing:border-box;padding:26px;background:#fff7e5;border-bottom:48px solid #775478;box-shadow:0 3px 6px #0004}.copy{color:#64748b}.amount{display:grid;grid-template-columns:1fr 93px;gap:12px;margin-top:38px}.col strong{display:block;font-size:14px;margin-top:6px}.bottom{position:absolute;bottom:35px;left:26px;right:65px;text-align:right;font-size:26px}.hide{display:none}.diagrams img{width:1100px;max-width:100%;background:white}small{color:#64748b}</style><h1>Cashflow｜交互与布局设计原型</h1><p>这是可点击的设计评审原型，不执行游戏结算；真实实现与证据见对应规格及截图。</p><button onclick="mode('start')">开始回合</button><button onclick="mode('trade')">股票份数</button><button onclick="mode('fast')">快车道报表</button><button onclick="mode('board')">查看棋盘</button><div class="stage"><div class="board"></div><div class="sheet hide" id="sheet"><h2 id="st">财务报表</h2><p>左列：收入／支出／资产负债</p><p>右列：目标与进度／现金摘要</p><div class="bottom">现金流日收入 $1,080,000<br>现金 $1,953,080</div></div><div class="card" id="card"><h2 id="ct">开始回合</h2><p id="body">查看财务报表后选择骰子。未确认事件不能结束回合。</p><div class="amount hide" id="qty"><div>买入份数：<input type="number" value="99999" style="width:70px"></div><div class="col">需要现金：<strong>$49,999,500</strong></div></div><p class="copy">此卡位置：x656 y98；金额列93px</p></div></div><h2>用户流程</h2><div class="diagrams"><img src="用户回合流程.svg" alt="用户流程"><h2>系统架构</h2><img src="系统架构.svg" alt="系统架构"></div><script>function mode(m){sheet.classList.toggle('hide',!['trade','fast'].includes(m));card.classList.toggle('hide',m==='board');qty.classList.toggle('hide',m!=='trade');ct.textContent=m==='trade'?'股票买入份数':m==='fast'?'快车道事件':'开始回合';st.textContent=m==='fast'?'快车道目标与收入':'收入、支出、资产与负债';body.textContent=m==='trade'?'说明与金额上下分行，金额完整处于独立列。':m==='fast'?'取消或返回不应重建旧布局。':'查看报表后选择骰子。'};</script></html>
